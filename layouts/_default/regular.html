<!DOCTYPE html>
<html lang="en">
<head>
    {{- partial "head.html" . -}}
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f4ee] flex flex-col min-h-screen">
    {{- partial "header.html" . -}}
    
    <main class="flex-grow py-16 px-4">
        <div class="container mx-auto max-w-4xl">
            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="text-3xl md:text-5xl font-bold text-[#0a2e3a] mb-4">{{ .Title }}</h1>
                <div class="w-20 h-1 bg-gradient-to-r from-[#2bace2] to-[#1a8eb0] mx-auto rounded-full"></div>
            </div>

            <!-- Content -->
            <article class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-12">
                <div class="prose prose-lg max-w-none 
                    prose-headings:text-[#0a2e3a] prose-headings:font-bold 
                    prose-p:text-[#3a5a6a] prose-p:leading-relaxed 
                    prose-a:text-[#2bace2] prose-a:no-underline hover:prose-a:underline
                    prose-strong:text-[#0a2e3a]
                    prose-ul:marker:text-[#2bace2]
                    prose-li:text-[#3a5a6a]">
                    {{ .Content }}
                </div>
            </article>
        </div>
    </main>

    {{- partial "footer.html" . -}}
</body>
</html>
