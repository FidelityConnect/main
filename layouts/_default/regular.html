<!DOCTYPE html>
<html lang="en">
<head>
    {{- partial "head.html" . -}}
</head>
<body class="bg-white flex flex-col min-h-screen">
    {{- partial "header.html" . -}}
    
    <main class="flex-grow">
        <!-- ── PAGE HEADER ── -->
        <header class="relative overflow-hidden bg-neutral-light py-24 md:py-32 border-b border-neutral-border">
            <!-- Decorative Accents -->
            <div class="absolute inset-0 pointer-events-none overflow-hidden">
                <div class="absolute -top-24 -right-24 h-96 w-96 rounded-full bg-brand-blue/5 blur-3xl"></div>
                <div class="absolute -bottom-24 -left-24 h-96 w-96 rounded-full bg-brand-orange/5 blur-3xl"></div>
                <!-- Grid Pattern -->
                <div class="absolute inset-0 opacity-[0.05]" style="background-image: radial-gradient(#111827 1px, transparent 1px); background-size: 64px 64px;"></div>
            </div>

            <div class="relative z-10 mx-auto max-w-4xl px-6 md:px-12 lg:px-16 text-center">
                <h1 class="font-heading font-bold text-4xl md:text-5xl lg:text-6xl text-neutral-dark leading-tight tracking-tight">
                    {{ .Title }}
                </h1>
            </div>
        </header>

        <!-- ── CONTENT SECTION ── -->
        <article class="py-24 bg-white">
            <div class="mx-auto max-w-4xl px-6">
                <div class="bg-white rounded-[32px] border border-neutral-border shadow-2xl p-8 md:p-12 lg:p-16 relative z-20 -mt-24">
                    <div class="font-body text-lg text-neutral-dark leading-relaxed space-y-8 prose prose-lg prose-blue max-w-none">
                        {{ .Content }}
                    </div>
                </div>
            </div>
        </article>
    </main>

    {{- partial "footer.html" . -}}
</body>
</html>
