<!DOCTYPE html>
<html lang="en">

<head>
    {{- partial "head.html" . -}}
</head>

<body>
    {{- partial "header.html" . -}}
    <main>
        <div class="post_page">
            <div class="content rounded-lg">
                <article class="blog-content">
                    <div class="bg">
                        <img src="{{ .Params.featured }}" alt="{{ .Title }}">
                    </div>
                    <header>
                        <h2>{{ .Title }}</h2>
                        <div class="meta text-sm">{{ dateFormat "Monday, Jan 2, 2006" .Date }} |
                            {{ .Params.author }}</div>
                        {{ range .Params.Categories }}
                        <div class="category text-green-500 my-3 uppercase">{{ . }}</div>
                        {{ end }}
                    </header>
                    <hr class="mb-5">
                    {{ .Content }}
                </article>
            </div>
        </div>
    </main>
    {{- partial "footer.html" . -}}
</body>

</html>
