<style>
  /* ── Footer tokens ── */
  .ft {
    --ft-blue: rgb(26 111 219);
    --ft-orange: rgb(240 113 32);
    --ft-muted: rgb(107 114 128);
    --ft-dark: rgb(17 24 39);
    --ft-border: rgb(229 231 235);
    --ft-ease: cubic-bezier(0.16, 1, 0.3, 1);
    --ft-dur: 0.55s;
  }

  /* ── Headings ── */
  .ft-heading {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    font-family: Poppins, DM Sans, sans-serif;
    font-size: 0.875rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ft-dark);
  }
  .ft-heading-line {
    flex: 1;
    height: 1px;
    background: rgb(26 111 219 / 0.2);
    transform-origin: left center;
    transform: scaleX(0);
  }
  .ft-reveal.is-visible .ft-heading-line {
    animation: ft-line-grow 0.8s var(--ft-ease) forwards;
  }

  /* ── Links (nav + meta) ── */
  .ft-link {
    color: var(--ft-muted);
    transition: color 0.3s ease;
  }
  .ft-link:hover { color: var(--ft-blue); }
  .ft-link--nav { font-size: 0.875rem; }
  .ft-link--meta {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .ft-meta {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ft-muted);
  }

  /* ── Icon box (shared: social + contact) ── */
  .ft-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.75rem;
    background: #fff;
    border: 1px solid var(--ft-border);
    transition: transform 0.35s var(--ft-ease), border-color 0.3s, color 0.3s, box-shadow 0.35s;
    will-change: transform;
  }
  .ft-icon-glyph {
    width: 1.25rem;
    height: 1.25rem;
    fill: currentColor;
    transition: transform 0.35s var(--ft-ease);
  }
  .ft-icon--stroke {
    width: 1.25rem;
    height: 1.25rem;
    color: var(--ft-blue);
  }

  .ft-icon--social {
    color: var(--ft-muted);
  }
  .ft-icon--social:hover {
    color: var(--ft-blue);
    border-color: var(--ft-blue);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    transform: translate3d(0, -3px, 0) scale(1.05);
  }
  .ft-icon--social:hover .ft-icon-glyph { transform: scale(1.12); }

  .ft-contact { display: flex; align-items: center; gap: 0.75rem; }
