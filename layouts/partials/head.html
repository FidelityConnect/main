<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=DM+Sans:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<title>
    {{- if .IsHome -}}
        {{ .Site.Title }}
    {{- else -}}
        {{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}
    {{- end -}}
</title>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO & Meta Tags -->
<meta name="keywords" content="jobs in Kenya, Kenya job vacancies, international jobs from Kenya, overseas jobs Kenya, local jobs Kenya, job seekers Kenya, work abroad from Kenya, recruitment agency Kenya, career opportunities Kenya, apply jobs online Kenya, global education placement Kenya, study abroad Kenya, international student placement, labour recruitment Kenya, skilled worker recruitment, workforce solutions Kenya, investment facilitation Kenya, business investment Kenya, foreign investment opportunities Kenya, Fidelity Connect Limited">
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.overview }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}{{ end }}">
<meta name="robots" content="index, follow">
<meta name="author" content="Fidelity Connect Limited">
<meta name="language" content="English">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="Fidelity Connect">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.overview }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}{{ end }}">
<meta property="og:image" content="{{ with .Params.featured }}{{ . | absURL }}{{ else }}{{ index .Site.Params.images 0 | absURL }}{{ end }}">
<meta property="og:locale" content="en_KE">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ .Permalink }}">
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.overview }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}{{ end }}">
<meta name="twitter:image" content="{{ with .Params.featured }}{{ . | absURL }}{{ else }}{{ index .Site.Params.images 0 | absURL }}{{ end }}">
<style>
    .animate-me {
        opacity: 0;
    }
</style>

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1a6fdb" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fidelity">

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-3FYDPYK3MP');
</script>
