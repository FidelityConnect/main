<!-- Contact Form Modal -->
<div id="contactForm" class="hidden fixed inset-0 z-[10000] flex items-center justify-center p-4">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-neutral-dark/40 backdrop-blur-md transition-opacity duration-300" onclick="closeForm()"></div>
    
    <!-- Modal Card -->
    <div class="relative z-[10001] w-full max-w-2xl bg-white rounded-[32px] shadow-2xl overflow-hidden transform transition-all duration-300 scale-95 opacity-0" id="contactModal">
        <!-- Close Button -->
        <button class="absolute top-6 right-6 p-2 rounded-full bg-neutral-light text-neutral-muted hover:text-brand-blue hover:bg-brand-blue/10 transition-all z-20" onclick="closeForm()" aria-label="Close">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <div class="px-8 py-10 md:p-12">
            <!-- Header -->
            <div class="mb-10">
                <h2 class="font-heading font-bold text-3xl text-neutral-dark mb-4 tracking-tight">Submit <span class="text-brand-blue">Application</span></h2>
                <p class="font-body text-neutral-muted leading-relaxed">
                    Fill in your details and upload your CV — our team will be in touch within 24 hours.
                </p>
            </div>

            <!-- Form -->
            <form name="contact" method="POST" action="/.netlify/functions/mailer" enctype="multipart/form-data" class="space-y-6">
                <!-- Hidden fields for Netlify Mailer -->
                <input type="hidden" name="form_type" value="{{ if in .RelPermalink "international" }}international{{ else }}local{{ end }}">
                <input type="hidden" name="job_title" value="{{ .Title | default "General Application" }}">

                <!-- Row: Name -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="fn" class="block font-heading font-bold text-xs uppercase tracking-widest text-neutral-dark opacity-70">First Name</label>
                        <input type="text" name="fn" id="fn" required
                            class="w-full rounded-2xl border border-neutral-border bg-neutral-light px-6 py-4 text-neutral-dark font-body placeholder-neutral-muted focus:border-brand-blue focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-blue/5 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label for="ln" class="block font-heading font-bold text-xs uppercase tracking-widest text-neutral-dark opacity-70">Last Name</label>
                        <input type="text" name="ln" id="ln" required
                            class="w-full rounded-2xl border border-neutral-border bg-neutral-light px-6 py-4 text-neutral-dark font-body placeholder-neutral-muted focus:border-brand-blue focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-blue/5 transition-all">
                    </div>
                </div>

                <!-- Row: Contact -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="email" class="block font-heading font-bold text-xs uppercase tracking-widest text-neutral-dark opacity-70">Email Address</label>
                        <input type="email" name="email" id="email" required
                            class="w-full rounded-2xl border border-neutral-border bg-neutral-light px-6 py-4 text-neutral-dark font-body placeholder-neutral-muted focus:border-brand-blue focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-blue/5 transition-all">
                    </div>
                    <div class="space-y-2">
                        <label for="phone" class="block font-heading font-bold text-xs uppercase tracking-widest text-neutral-dark opacity-70">Phone Number</label>
                        <input type="tel" name="phone" id="phone" required placeholder="+254..."
                            class="w-full rounded-2xl border border-neutral-border bg-neutral-light px-6 py-4 text-neutral-dark font-body placeholder-neutral-muted focus:border-brand-blue focus:bg-white focus:outline-none focus:ring-4 focus:ring-brand-blue/5 transition-all">
                    </div>
                </div>


                <!-- CV Upload -->
                <div class="space-y-2">
                    <label for="cv" class="block font-heading font-bold text-xs uppercase tracking-widest text-neutral-dark opacity-70">Upload CV / Résumé <span class="text-brand-blue">*</span></label>
                    <label for="cv" id="cv-drop-area" class="flex flex-col items-center justify-center gap-3 w-full rounded-2xl border-2 border-dashed border-neutral-border bg-neutral-light px-6 py-8 cursor-pointer hover:border-brand-blue hover:bg-brand-blue/5 transition-all group">
                        <div class="w-12 h-12 rounded-xl bg-brand-blue/10 flex items-center justify-center text-brand-blue group-hover:bg-brand-blue group-hover:text-white transition-all">
                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        </div>
                        <div class="text-center">
                            <p id="cv-label" class="font-heading font-semibold text-sm text-neutral-dark">Click to upload or drag & drop</p>
                            <p class="font-body text-xs text-neutral-muted mt-1">PDF, DOC, DOCX — max 5 MB</p>
                        </div>
                        <input type="file" name="cv" id="cv" accept=".pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required class="sr-only">
                    </label>
                </div>

                <!-- Submit -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full rounded-[20px] bg-brand-blue px-10 py-5 font-heading font-bold text-white shadow-lg shadow-brand-blue/20 transition-all hover:scale-[1.01] hover:bg-opacity-90 active:scale-95">
                        Submit Application
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openForm() {
        const contactForm = document.getElementById('contactForm');
        const contactModal = document.getElementById('contactModal');
        contactForm.classList.remove('hidden');
        contactForm.classList.add('flex');
        
        // Trigger animation
        setTimeout(() => {
            contactModal.classList.remove('scale-95', 'opacity-0');
            contactModal.classList.add('scale-100', 'opacity-100');
        }, 10);
        
        document.body.style.overflow = 'hidden';
    }

    function closeForm() {
        const contactForm = document.getElementById('contactForm');
        const contactModal = document.getElementById('contactModal');
        
        contactModal.classList.remove('scale-100', 'opacity-100');
        contactModal.classList.add('scale-95', 'opacity-0');
        
        setTimeout(() => {
            contactForm.classList.remove('flex');
            contactForm.classList.add('hidden');
            document.body.style.overflow = '';
        }, 300);
    }

    // CV upload — show selected filename
    document.addEventListener('DOMContentLoaded', function () {
        const cvInput = document.getElementById('cv');
        const cvLabel = document.getElementById('cv-label');
        const cvDropArea = document.getElementById('cv-drop-area');
        if (cvInput && cvLabel && cvDropArea) {
            cvInput.addEventListener('change', function () {
                if (cvInput.files && cvInput.files.length > 0) {
                    cvLabel.textContent = cvInput.files[0].name;
                    cvDropArea.classList.add('border-brand-blue');
                } else {
                    cvLabel.textContent = 'Click to upload or drag & drop';
                    cvDropArea.classList.remove('border-brand-blue');
                }
            });
        }
    });
</script>
