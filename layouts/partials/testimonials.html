<div id="testimonials" class="relative overflow-hidden bg-[#f7f4ee] py-20">

  <!-- Subtle geometric accents matching hero style -->
  <div class="absolute right-0 top-0 h-full w-1/2 bg-gradient-to-bl from-[#2bace2]/6 to-transparent pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#eee9de]/60 to-transparent pointer-events-none"></div>

  <!-- Decorative circle accent -->
  <div class="absolute top-16 right-12 rounded-full border-[6px] pointer-events-none"
       style="height:160px; width:160px; border-color:#f8952118;"></div>
  <div class="absolute bottom-20 left-8 rounded-full pointer-events-none"
       style="height:280px; width:280px; background-color:#2bace208;"></div>

  <div class="relative z-10 mx-auto max-w-7xl px-6 md:px-12 lg:px-16">

    <!-- Eyebrow + Section label -->
    <div class="mb-6 flex items-center justify-center gap-3">
      <span class="h-px w-8 bg-[#f89521]"></span>
      <span class="text-xs font-semibold uppercase tracking-[0.2em] text-[#f89521]">Success Stories</span>
      <span class="h-px w-8 bg-[#f89521]"></span>
    </div>

    <!-- Section headline -->
    <div class="mb-14 text-center">
      <h2 class="font-black leading-[1.05] tracking-tight text-[#0a2e3a]"
          style="font-size: clamp(2.4rem, 4.5vw, 3.5rem);">
        What Our <span class="text-[#2bace2]">Clients</span> Say
      </h2>
      <p class="mt-5 text-base leading-relaxed text-[#3a5a6a] max-w-md mx-auto">
        Hear from professionals who've successfully landed jobs through our platform.
      </p>
    </div>

    <!-- Testimonials Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {{ range .Site.Data.about.content.clients }}
      <div class="group relative bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-1">

        <!-- Top accent bar -->
        <div class="h-1 w-full" style="background: linear-gradient(90deg, #2bace2, #f89521);"></div>

        <div class="p-7 flex flex-col h-full">

          <!-- Opening quote mark -->
          <div class="mb-4 text-5xl font-black leading-none text-[#2bace2]/20 select-none">&ldquo;</div>

          <!-- Quote text -->
          <p class="text-[#3a5a6a] leading-relaxed text-[0.95rem] mb-6 flex-1">
            {{ .text }}
          </p>

          <!-- Footer row -->
          <div class="flex items-center justify-between pt-5 border-t" style="border-color:#2bace215;">
            <div>
              <p class="font-bold text-[#0a2e3a] text-sm">{{ .name }}</p>
              <p class="text-xs text-[#3a5a6a] mt-0.5">{{ .loc }}</p>
              {{ if .footer }}
              <p class="text-xs text-[#f89521] font-semibold mt-1">{{ .footer }}</p>
              {{ end }}
            </div>
            <!-- Stars -->
            <div class="flex gap-0.5">
              {{ range seq 5 }}
              <svg class="h-4 w-4" fill="#f89521" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
              {{ end }}
            </div>
          </div>
        </div>
      </div>
      {{ end }}
    </div>

  </div>
</div>
