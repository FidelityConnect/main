<section class="py-24 bg-white relative overflow-hidden">
    <!-- Decorative accent -->
    <div class="absolute top-0 right-0 w-96 h-96 bg-brand-blue/5 blur-[120px] rounded-full pointer-events-none"></div>

    <div class="max-w-4xl mx-auto px-6 relative z-10">
        <!-- Section Header -->
        <div class="text-center mb-20">
            <div class="flex items-center justify-center space-x-2 mb-6">
                <span class="w-8 h-[2px] bg-brand-orange rounded-full"></span>
                <span class="text-xs font-heading font-bold uppercase tracking-widest text-brand-orange">Got Questions?</span>
                <span class="w-8 h-[2px] bg-brand-orange rounded-full"></span>
            </div>
            <h2 class="font-heading font-bold text-3xl md:text-5xl text-neutral-dark mb-6 tracking-tight">
                Frequently Asked <span class="text-brand-blue">Questions</span>
            </h2>
            <p class="font-body text-lg text-neutral-muted max-w-2xl mx-auto leading-relaxed">
                Everything you need to know about our global recruitment, education, and investment services.
            </p>
        </div>

        <!-- FAQ Items -->
        <div class="space-y-4">
            {{ range $index, $item := .Site.Data.faq }}
            <div class="faq-item group border border-neutral-border rounded-[24px] bg-white transition-all duration-300 hover:border-brand-blue/30 overflow-hidden">
                <button class="flex justify-between items-center w-full p-6 md:p-8 text-left focus:outline-none" onclick="toggleFAQ(this)">
                    <span class="text-lg font-heading font-bold text-neutral-dark pr-8 transition-colors duration-300 group-[.active]:text-brand-blue">{{ $item.question }}</span>
                    <div class="faq-icon-container flex-shrink-0 w-10 h-10 rounded-2xl bg-neutral-light flex items-center justify-center transition-all duration-300 group-[.active]:bg-brand-blue group-[.active]:text-white">
                        <svg class="w-5 h-5 transform transition-transform duration-300 group-[.active]:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </div>
                </button>
                <div class="faq-answer max-h-0 opacity-0 px-6 md:px-8 pb-0 hidden transition-all duration-500 ease-in-out">
                    <div class="pb-8 font-body text-neutral-muted leading-relaxed text-base">
                        {{ $item.answer | markdownify }}
                    </div>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>

<script>
    function toggleFAQ(button) {
        const item = button.parentElement;
        const answer = button.nextElementSibling;
        const allItems = document.querySelectorAll('.faq-item');
        
        // Toggle current item
        const isActive = item.classList.contains('active');
        
        // Close others
        allItems.forEach(i => {
            i.classList.remove('active');
            const a = i.querySelector('.faq-answer');
            a.classList.add('hidden');
            a.style.maxHeight = '0';
            a.style.opacity = '0';
        });

        if (!isActive) {
            item.classList.add('active');
            item.classList.add('shadow-xl', 'shadow-brand-blue/5', 'border-brand-blue/50');
            answer.classList.remove('hidden');
            // Small timeout to allow transition
            setTimeout(() => {
                answer.style.maxHeight = '500px';
                answer.style.opacity = '1';
            }, 10);
        } else {
            item.classList.remove('shadow-xl', 'shadow-brand-blue/5', 'border-brand-blue/50');
        }
    }
</script>
