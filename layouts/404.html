<!DOCTYPE html>
<html lang="en">
<head>
    {{- partial "head.html" . -}}
</head>
<body class="bg-[#f7f4ee] flex flex-col min-h-screen">
    {{- partial "header.html" . -}}
    
    <main class="flex-grow flex items-center justify-center py-20 px-4">
        <div class="text-center max-w-2xl mx-auto">
            <h1 class="text-9xl font-bold text-[#0a2e3a] opacity-10 mb-4">404</h1>
            <div class="-mt-16 relative z-10">
                <h2 class="text-3xl md:text-4xl font-bold text-[#0a2e3a] mb-6">Page Not Found</h2>
                <div class="w-20 h-1 bg-gradient-to-r from-[#2bace2] to-[#1a8eb0] mx-auto rounded-full mb-8"></div>
                <p class="text-lg text-[#3a5a6a] mb-10">
                    Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                </p>
                
                <a href="/" class="inline-block rounded-full bg-[#2bace2] px-8 py-4 font-bold text-white uppercase tracking-wider shadow-lg shadow-[#2bace2]/30 transition-all duration-300 hover:bg-[#1a8cb5] hover:-translate-y-1 hover:shadow-xl">
                    Back to Home
                </a>
            </div>
        </div>
    </main>

    {{- partial "footer.html" . -}}
</body>
</html>
