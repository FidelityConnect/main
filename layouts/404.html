<!DOCTYPE html>
<html lang="en">
<head>
    {{- partial "head.html" . -}}
</head>
<body class="bg-white flex flex-col min-h-screen">
    {{- partial "header.html" . -}}
    
    <main class="flex-grow flex items-center justify-center py-24 px-6 relative overflow-hidden">
        <!-- Decorative accents -->
        <div class="absolute inset-0 pointer-events-none">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[20rem] md:text-[30rem] font-heading font-bold text-neutral-light/50 select-none">404</div>
            <div class="absolute top-0 right-0 w-96 h-96 bg-brand-blue/5 blur-[120px] rounded-full"></div>
            <div class="absolute bottom-0 left-0 w-96 h-96 bg-brand-orange/5 blur-[120px] rounded-full"></div>
        </div>

        <div class="relative z-10 text-center max-w-2xl mx-auto">
            <div class="mb-10 inline-flex items-center space-x-2">
                <span class="w-8 h-[2px] bg-brand-orange rounded-full"></span>
                <span class="text-xs font-heading font-bold uppercase tracking-widest text-brand-orange">Lost in space?</span>
                <span class="w-8 h-[2px] bg-brand-orange rounded-full"></span>
            </div>
            
            <h1 class="font-heading font-bold text-5xl md:text-7xl text-neutral-dark mb-8 tracking-tight">Page <span class="text-brand-blue">Not Found</span></h1>
            
            <p class="font-body text-lg text-neutral-muted mb-12 leading-relaxed">
                The content you're looking for might have been moved, renamed, or is temporarily unavailable. Let's get you back on track.
            </p>
            
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="/" class="w-full sm:w-auto inline-flex items-center justify-center bg-brand-blue text-white font-heading font-bold px-10 py-5 rounded-[20px] shadow-lg shadow-brand-blue/20 transition-all hover:scale-[1.02] active:scale-95">
                    Back to Home
                </a>
                <a href="/jobs/" class="w-full sm:w-auto inline-flex items-center justify-center bg-white text-neutral-dark border border-neutral-border font-heading font-bold px-10 py-5 rounded-[20px] transition-all hover:border-brand-blue hover:text-brand-blue">
                    Browse Jobs
                </a>
            </div>
        </div>
    </main>

    {{- partial "footer.html" . -}}
</body>
</html>
