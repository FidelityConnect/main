- question: "How long does the application and job placement process take?"
  answer: "The timeline varies depending on the employer and destination country. On average, the process takes 4–12 weeks, covering interviews, documentation, visa processing, and travel arrangements."

- question: "What are the basic requirements to qualify for jobs abroad?"
  answer: |
    Applicants are generally required to have:
    
    * A valid passport (with sufficient validity)
    * Relevant work experience for the job applied
    * A well-prepared CV
    * Any additional requirements specified by the employer, such as certifications or language proficiency

- question: "What support does Fidelity offer after job placement?"
  answer: |
    Fidelity provides post-placement support which includes:
    
    * Airport drop-off in Kenya and pick-up in the destination country
    * Settlement and orientation assistance
    * Up to six months of follow-up support to ensure a smooth transition into work and life abroad