name: Deploy Hugo Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Hugo
        run: |
          sudo dpkg -i ./hugo_0.120.3_linux-amd64.deb

      - name: Build
        run: hugo --minify 
